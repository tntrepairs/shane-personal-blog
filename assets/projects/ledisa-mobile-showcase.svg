<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 405 405" fill="none">
  <title>Two illustrative Ledisa ERP mobile application screens</title>
  <desc>A foreground smartphone shows inventory, sales, finance and reports. A second phone shows sample charts without financial statistics.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="160" y2="330" gradientUnits="userSpaceOnUse"><stop stop-color="#565652"/><stop offset=".25" stop-color="#171815"/><stop offset=".55" stop-color="#73736e"/><stop offset=".82" stop-color="#20211e"/><stop offset="1" stop-color="#4d4e48"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="140" y2="320" gradientUnits="userSpaceOnUse"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#eee9e1"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="150" y2="320" gradientUnits="userSpaceOnUse"><stop stop-color="white" stop-opacity=".2"/><stop offset=".48" stop-color="white" stop-opacity="0"/><stop offset="1" stop-color="white" stop-opacity=".08"/></linearGradient>
    <filter id="shadow" x="-35%" y="-15%" width="175%" height="140%"><feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#25241f" flood-opacity=".19"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="5"/></filter>
    <symbol id="cube" viewBox="0 0 24 24"><path d="m12 2 9 5v10l-9 5-9-5V7Z" fill="#22231f"/><path d="m3 7 9 5 9-5M12 12v10M7.5 4.5l9 5v5" stroke="#faf7f0" stroke-width="1.1"/></symbol>
    <symbol id="sales" viewBox="0 0 24 24"><path d="M3 14h4v8H3zM10 10h4v12h-4zM17 5h4v17h-4z" fill="#292a25"/><path d="m3 10 7-5 5 2 6-5m-5 0h5v5" stroke="#292a25" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="coins" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3" fill="#252620"/><path d="M4 6v4c4 4 12 4 16 0V6c-4 4-12 4-16 0Zm0 6v4c4 4 12 4 16 0v-4c-4 4-12 4-16 0Zm0 6v2c4 4 12 4 16 0v-2c-4 4-12 4-16 0Z" fill="#252620"/></symbol>
    <symbol id="report" viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H4L6 2Zm8 1v6h5M8 12h8M8 15h8M8 18h6" stroke="#282922" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="home" viewBox="0 0 24 24"><path d="m2 10 10-8 10 8-2 2-2-1v11h-5v-7h-3v7H5V11l-1 1Z" fill="currentColor"/></symbol>
    <symbol id="grid" viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="person" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4" fill="currentColor"/><path d="M4 22v-3a8 8 0 0 1 16 0v3Z" fill="currentColor"/></symbol>
  </defs>
  <ellipse cx="223" cy="233" rx="166" ry="131" transform="rotate(-20 223 233)" fill="#e7e1d7" opacity=".36"/>
  <ellipse cx="227" cy="378" rx="170" ry="17" fill="#d5d0c7" opacity=".38"/>
  <ellipse cx="219" cy="379" rx="137" ry="7" fill="#77736a" opacity=".2" filter="url(#blur)"/>
  <!-- Recessed analytics phone: the charts are illustrative, with no claimed figures. -->
  <g transform="matrix(.97 -.024 -.126 .97 235 81)" filter="url(#shadow)">
    <rect x="4" y="2" width="139" height="282" rx="24" fill="url(#edge)" stroke="#55564f"/>
    <rect width="139" height="282" rx="24" fill="#171815"/>
    <rect x="5" y="5" width="129" height="272" rx="20" fill="url(#screen)" stroke="#bcb9b0"/>
    <rect x="48" y="11" width="39" height="9" rx="4.5" fill="#0e0f0c"/>
    <circle cx="80" cy="15" r="1.3" fill="#30332c"/>
    <path d="M108 15h3m2 0h3m2-1h6v3h-6" stroke="#77766e" stroke-width="1"/>
    <text x="14" y="43" fill="#45453d" font-family="Arial, sans-serif" font-size="10" font-weight="600">Analytics</text>
    <rect x="12" y="57" width="115" height="88" rx="5" fill="#f8f5ee"/>
    <path d="M22 128h93M22 110h93M22 92h93M22 74h93" stroke="#e9e4dc" stroke-width=".8"/>
    <path d="M24 114h8v14h-8zM37 105h8v23h-8zM50 98h8v30h-8zM63 88h8v40h-8zM76 80h8v48h-8zM89 70h8v58h-8zM102 62h8v66h-8z" fill="#85837b"/>
    <path d="M28 114h4v14h-4zM41 105h4v23h-4zM54 98h4v30h-4zM67 88h4v40h-4zM80 80h4v48h-4zM93 70h4v58h-4zM106 62h4v66h-4z" fill="#77756e"/>
    <rect x="12" y="152" width="115" height="68" rx="5" fill="#f9f6ef"/>
    <circle cx="87" cy="186" r="20" stroke="#bab7af" stroke-width="10"/>
    <path d="M87 166a20 20 0 0 1 19 26" stroke="#74756d" stroke-width="10"/>
    <rect x="12" y="227" width="115" height="35" rx="5" fill="#e9e5de"/>
    <g fill="#c4c0b8"><circle cx="49" cy="236" r="4"/><circle cx="49" cy="249" r="4"/><rect x="59" y="233" width="54" height="5" rx="2"/><rect x="59" y="246" width="43" height="5" rx="2"/></g>
    <rect x="49" y="271" width="42" height="2" rx="1" fill="#4d4e47"/>
    <path d="M142 77v29" stroke="#161713" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Foreground product overview phone. -->
  <g transform="matrix(1 -.12 -.13 1 119 49)" filter="url(#shadow)">
    <rect x="5" y="3" width="158" height="333" rx="27" fill="url(#edge)" stroke="#4a4b45" stroke-width="1.2"/>
    <rect width="158" height="333" rx="27" fill="#121310" stroke="#60615a" stroke-width=".7"/>
    <rect x="5" y="5" width="148" height="323" rx="23" fill="url(#screen)" stroke="#c5c2b8" stroke-width=".8"/>
    <rect x="57" y="12" width="45" height="12" rx="6" fill="#080a07"/>
    <circle cx="94" cy="18" r="2" fill="#252b24"/>
    <use href="#cube" x="24" y="39" width="17" height="19"/>
    <text x="46" y="52" fill="#1b1c17" font-family="Arial, sans-serif" font-size="11" font-weight="600">Ledisa ERP</text>
    <text x="15" y="82" fill="#20221b" font-family="Arial, sans-serif" font-size="10.5" font-weight="500">Good morning</text>
    <text x="15" y="96" fill="#44453d" font-family="Arial, sans-serif" font-size="8.5">Overview</text>
    <g fill="#fffcf7" stroke="#e8e2d8" stroke-width=".6"><rect x="13" y="119" width="63" height="61" rx="7"/><rect x="82" y="119" width="63" height="61" rx="7"/><rect x="13" y="186" width="63" height="61" rx="7"/><rect x="82" y="186" width="63" height="61" rx="7"/></g>
    <use href="#cube" x="34" y="132" width="22" height="24"/>
    <use href="#sales" x="102" y="132" width="23" height="24"/>
    <use href="#coins" x="34" y="199" width="23" height="24"/>
    <use href="#report" x="102" y="199" width="23" height="24"/>
    <g fill="#272922" font-family="Arial, sans-serif" font-size="8" text-anchor="middle"><text x="45" y="168">Inventory</text><text x="114" y="168">Sales</text><text x="45" y="235">Finance</text><text x="114" y="235">Reports</text></g>
    <path d="M8 270h141" stroke="#e5e0d7" stroke-width=".7"/>
    <use href="#home" x="23" y="282" width="15" height="16" color="#24271f"/>
    <use href="#grid" x="72" y="283" width="14" height="14" color="#95968c"/>
    <use href="#person" x="121" y="282" width="14" height="16" color="#95968c"/>
    <rect x="53" y="319" width="51" height="2.5" rx="1.25" fill="#23251e"/>
    <rect x="5" y="5" width="148" height="323" rx="23" fill="url(#glass)"/>
    <path d="M162 91v38M-1 70v20M-1 100v29" stroke="#373932" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
